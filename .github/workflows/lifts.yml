name: Stato impianti Sella Nevea
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/scripts/**", ".github/workflows/lifts.yml"]
permissions:
  contents: write
concurrency: lifts
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/lifts.py
      - run: |
          git config user.name "lifts-bot"
          git config user.email "lifts-bot@users.noreply.github.com"
          git pull -q --rebase || true
          git add freeride/lifts.json
          git diff --cached --quiet || (git commit -m "Stato impianti aggiornato" && git push)
